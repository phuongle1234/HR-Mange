<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change Password - EmployeeOS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { brand: { 50: '#ecfdf3', 100: '#d1fadf', 500: '#12b76a', 600: '#039855', 700: '#027a48' } }, boxShadow: { soft: '0 18px 50px rgba(16,24,40,.10)' } } } }</script>
</head>

<body
  class="min-h-screen bg-[radial-gradient(circle_at_top,_#d1fadf_0,_transparent_34%),linear-gradient(180deg,_#f8faf9,_#eef2f0)] text-slate-700 antialiased">
  <main class="grid min-h-screen place-items-center px-4">
    <section class="w-full max-w-md">
      <div class="mb-8 flex items-center justify-center gap-3">
        <div
          class="grid h-11 w-11 place-items-center rounded-xl bg-brand-500 text-lg font-black text-white shadow-lg shadow-emerald-200">
          E</div>
        <div>
          <div class="text-xl font-black text-slate-950">EmployeeOS</div>
          <div class="text-xs font-semibold uppercase text-brand-700">Account recovery</div>
        </div>
      </div>
      <form class="rounded-2xl border border-white/70 bg-white/95 p-8 shadow-soft backdrop-blur">
        <div class="mb-7 text-center">
          <h1 class="text-2xl font-black text-slate-950">Change Password</h1>
          <p class="mt-2 text-sm text-slate-500">Update your password to keep your workspace secure.</p>
        </div>
        <label class="mb-2 block text-sm font-bold text-slate-700">Current password</label>
        <input
          class="mb-4 h-11 w-full rounded-lg border border-slate-200 px-3 text-sm outline-none ring-brand-100 focus:border-brand-500 focus:ring-4"
          type="password" value="current">
        <label class="mb-2 block text-sm font-bold text-slate-700">New password</label>
        <input
          class="mb-4 h-11 w-full rounded-lg border border-slate-200 px-3 text-sm outline-none ring-brand-100 focus:border-brand-500 focus:ring-4"
          type="password" value="new-password">
        <label class="mb-2 block text-sm font-bold text-slate-700">Confirm new password</label>
        <input
          class="h-11 w-full rounded-lg border border-slate-200 px-3 text-sm outline-none ring-brand-100 focus:border-brand-500 focus:ring-4"
          type="password" value="new-password">
        <button
          class="mt-6 h-11 w-full rounded-lg bg-brand-500 text-sm font-black text-white shadow-lg shadow-emerald-100 hover:bg-brand-600">Change
          Password</button>
        <a href="employee-detail.html" class="mt-4 block text-center text-sm font-bold text-brand-700">Back to
          employees</a>
      </form>
    </section>
  </main>
</body>

</html>
